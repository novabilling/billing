apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: novabilling
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: novabilling
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads
  namespace: novabilling
  labels:
    app.kubernetes.io/part-of: novabilling
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: novabilling
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: novabilling
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z central-db 5432 && nc -z tenant-db 5432 && nc -z redis 6379; do
                echo "Waiting for databases and redis..."
                sleep 2
              done
      containers:
        - name: api
          image: ghcr.io/novabilling/api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: novabilling-config
            - secretRef:
                name: novabilling-secrets
          env:
            - name: CENTRAL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novabilling-secrets
                  key: CENTRAL_DB_PASSWORD
            - name: TENANT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novabilling-secrets
                  key: TENANT_DB_PASSWORD
            - name: CENTRAL_DATABASE_URL
              value: "postgresql://central:$(CENTRAL_DB_PASSWORD)@central-db:5432/central"
            - name: INTERNAL_POSTGRES_URL
              value: "postgresql://postgres:$(TENANT_DB_PASSWORD)@tenant-db:5432/postgres"
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
