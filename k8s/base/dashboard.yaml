apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: novabilling
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: novabilling
spec:
  selector:
    app.kubernetes.io/name: dashboard
  ports:
    - port: 4002
      targetPort: 4002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: novabilling
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: novabilling
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/novabilling/dashboard:latest
          ports:
            - containerPort: 4002
          env:
            - name: BACKEND_URL
              value: "http://api:4000"
          readinessProbe:
            httpGet:
              path: /
              port: 4002
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
