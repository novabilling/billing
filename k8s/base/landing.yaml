apiVersion: v1
kind: Service
metadata:
  name: landing
  namespace: novabilling
  labels:
    app.kubernetes.io/name: landing
    app.kubernetes.io/part-of: novabilling
spec:
  selector:
    app.kubernetes.io/name: landing
  ports:
    - port: 4001
      targetPort: 4001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing
  namespace: novabilling
  labels:
    app.kubernetes.io/name: landing
    app.kubernetes.io/part-of: novabilling
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: landing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: landing
    spec:
      containers:
        - name: landing
          image: ghcr.io/novabilling/landing:latest
          ports:
            - containerPort: 4001
          readinessProbe:
            httpGet:
              path: /
              port: 4001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
