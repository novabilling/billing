apiVersion: v1
kind: Service
metadata:
  name: central-db
  namespace: novabilling
  labels:
    app.kubernetes.io/name: central-db
    app.kubernetes.io/part-of: novabilling
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: central-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: central-db
  namespace: novabilling
  labels:
    app.kubernetes.io/name: central-db
    app.kubernetes.io/part-of: novabilling
spec:
  serviceName: central-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: central-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: central-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: central
            - name: POSTGRES_USER
              value: central
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novabilling-secrets
                  key: CENTRAL_DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "central"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "central"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
