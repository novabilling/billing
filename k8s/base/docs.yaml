apiVersion: v1
kind: Service
metadata:
  name: docs
  namespace: novabilling
  labels:
    app.kubernetes.io/name: docs
    app.kubernetes.io/part-of: novabilling
spec:
  selector:
    app.kubernetes.io/name: docs
  ports:
    - port: 4003
      targetPort: 4003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs
  namespace: novabilling
  labels:
    app.kubernetes.io/name: docs
    app.kubernetes.io/part-of: novabilling
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docs
    spec:
      containers:
        - name: docs
          image: ghcr.io/novabilling/docs:latest
          ports:
            - containerPort: 4003
          readinessProbe:
            httpGet:
              path: /
              port: 4003
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
