apiVersion: v1
kind: Secret
metadata:
  name: novabilling-secrets
  namespace: novabilling
  labels:
    app.kubernetes.io/part-of: novabilling
type: Opaque
stringData:
  # ── Database passwords ──
  CENTRAL_DB_PASSWORD: "CHANGEME_central_password"
  TENANT_DB_PASSWORD: "CHANGEME_tenant_password"
  # ── JWT secrets (generate: openssl rand -hex 32) ──
  JWT_SECRET: "CHANGEME_jwt_secret_64_chars"
  JWT_REFRESH_SECRET: "CHANGEME_jwt_refresh_secret_64_chars"
  # ── Encryption key for provider credentials (generate: openssl rand -hex 32) ──
  ENCRYPTION_KEY: "CHANGEME_encryption_key_64_hex"
  # ── Email (optional) ──
  EMAIL_HOST: ""
  EMAIL_USER: ""
  EMAIL_PASSWORD: ""
