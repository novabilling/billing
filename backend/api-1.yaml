info:
  title: NovaBilling API
  description: >-
    NovaBilling is a multi-tenant billing and subscription management API. It
    supports African and global payment providers including Stripe, Paystack,
    Flutterwave, and M-Pesa.


    ## Authentication

    - **JWT (Bearer)**: Used for tenant management endpoints
    (`/api/tenants/me/*`, `/api/auth/*`). Obtain tokens via `/api/auth/login`.

    - **API Key**: Used for all billing resource endpoints (customers, plans,
    subscriptions, invoices, payments, analytics). Pass your API key in the
    `Authorization` header as `Bearer sk_live_...`.


    ## Webhooks

    Payment provider webhooks are received at `/webhooks/{provider}` (no `/api`
    prefix). Configure your provider dashboard to point to these URLs.

    NovaBilling also forwards billing events to your application via the webhook
    URL configured in your tenant settings.
  version: "1.0"
  contact: {}
tags:
  - name: Auth
    description: Authentication endpoints
  - name: Tenants
    description: Tenant management
  - name: Customers
    description: Customer management
  - name: Plans
    description: Plan management
  - name: Subscriptions
    description: Subscription management
  - name: Invoices
    description: Invoice management
  - name: Payments
    description: Payment management
  - name: Payment Providers
    description: Payment provider configuration
  - name: Webhooks
    description: Webhook endpoints
  - name: Analytics
    description: Analytics and reporting
servers:
  - url: https://api.novabilling.one
    description: API Server
components:
  securitySchemes:
    JWT:
      scheme: bearer
      bearerFormat: JWT
      type: http
    api-key:
      type: apiKey
      in: header
      name: Authorization
  schemas:
    RegisterDto:
      type: object
      properties:
        name:
          type: string
          example: John Doe
          description: Full name of the tenant owner
        email:
          type: string
          example: john@company.com
          description: Email address
        password:
          type: string
          example: securePassword123
          description: Password (min 8 characters)
        companyName:
          type: string
          example: Acme Corp
          description: Company name (used to generate slug)
      required:
        - name
        - email
        - password
        - companyName
    TenantInfoResponse:
      type: object
      properties:
        id:
          type: string
          example: clx1234567890
        name:
          type: string
          example: Acme Corp
        slug:
          type: string
          example: acme-corp
        email:
          type: string
          example: john@company.com
        apiKey:
          type: string
          example: sk_live_abc123...
        webhookUrl:
          type: string
          example: https://example.com/webhooks
        webhookSecret:
          type: string
        isActive:
          type: boolean
          example: true
        settings:
          type: object
          additionalProperties: true
        lastLoginAt:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - slug
        - email
        - apiKey
        - isActive
        - createdAt
        - updatedAt
    RegisterResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        tenant:
          $ref: "#/components/schemas/TenantInfoResponse"
        apiKey:
          type: string
          example: sk_live_abc123...
      required:
        - accessToken
        - refreshToken
        - tenant
        - apiKey
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: john@company.com
        password:
          type: string
          example: securePassword123
      required:
        - email
        - password
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        tenant:
          $ref: "#/components/schemas/TenantInfoResponse"
      required:
        - accessToken
        - refreshToken
        - tenant
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
          description: Refresh token
      required:
        - refreshToken
    TokenPairResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
      required:
        - accessToken
        - refreshToken
    ForgotPasswordDto:
      type: object
      properties:
        email:
          type: string
          example: john@company.com
      required:
        - email
    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Operation completed successfully
      required:
        - message
    ResetPasswordDto:
      type: object
      properties:
        token:
          type: string
          description: Password reset token
        newPassword:
          type: string
          example: newSecurePassword123
          description: New password (min 8 characters)
      required:
        - token
        - newPassword
    TenantResponse:
      type: object
      properties:
        id:
          type: string
          example: clx1234567890
        name:
          type: string
          example: Acme Corp
        slug:
          type: string
          example: acme-corp
        email:
          type: string
          example: john@company.com
        apiKey:
          type: string
          example: sk_live_abc123...
        webhookUrl:
          type: string
          example: https://example.com/webhooks
        webhookSecret:
          type: string
          example: whsec_abc123...
        isActive:
          type: boolean
          example: true
        settings:
          type: object
          additionalProperties: true
        lastLoginAt:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - slug
        - email
        - apiKey
        - isActive
        - createdAt
        - updatedAt
    UpdateTenantDto:
      type: object
      properties:
        name:
          type: string
          example: Updated Company Name
        email:
          type: string
          example: billing@company.com
        webhookUrl:
          type: string
          example: https://example.com/webhooks
        settings:
          type: object
          description: Custom tenant settings (merged with existing)
    TenantUsageResponse:
      type: object
      properties:
        customers:
          type: number
          example: 42
        activeSubscriptions:
          type: number
          example: 15
        totalInvoices:
