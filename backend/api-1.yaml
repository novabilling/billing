  /webhooks/paystack:
    post:
      description: Receives payment event notifications from Paystack. The signature
        is verified using HMAC-SHA512 with the provider's secret key. On
        success, updates the payment/invoice status and sends customer
        notifications.
      operationId: WebhooksController_paystack
      parameters:
        - name: x-paystack-signature
          required: true
          in: header
          description: Paystack HMAC-SHA512 signature
          schema:
            type: string
      responses:
        "200":
          description: Webhook processed successfully
      summary: Paystack webhook endpoint
      tags:
        - Webhooks
  /webhooks/flutterwave:
    post:
      description: Receives payment event notifications from Flutterwave. Verified
        using the verif-hash header against the configured encryption key.
      operationId: WebhooksController_flutterwave
      parameters:
        - name: verif-hash
          required: false
          in: header
          description: Flutterwave verification hash
          schema:
            type: string
      responses:
        "200":
          description: Webhook processed successfully
      summary: Flutterwave webhook endpoint
      tags:
        - Webhooks
  /webhooks/dpo:
    post:
      description: Receives payment callback notifications from DPO Group (DirectPay
        Online). Verifies the transaction token status and updates payment
        accordingly.
      operationId: WebhooksController_dpo
      parameters: []
      responses:
        "200":
          description: Webhook processed successfully
      summary: DPO Group webhook endpoint
      tags:
        - Webhooks
  /webhooks/payu:
    post:
      description: Receives Instant Payment Notifications (IPN) from PayU South
        Africa. Updates payment status based on the transaction state.
      operationId: WebhooksController_payu
      parameters: []
      responses:
        "200":
          description: Webhook processed successfully
      summary: PayU webhook endpoint
      tags:
        - Webhooks
  /webhooks/pesapal:
    post:
      description: Receives IPN (Instant Payment Notification) callbacks from Pesapal.
        Fetches transaction status using the OrderTrackingId and updates
        payment.
      operationId: WebhooksController_pesapal
      parameters: []
      responses:
        "200":
          description: Webhook processed successfully
      summary: Pesapal webhook endpoint
      tags:
        - Webhooks
  /webhooks/stripe:
    post:
      description: Receives event notifications from Stripe (e.g.
        checkout.session.completed, payment_intent.succeeded). Verified using
        the stripe-signature header with the configured webhook secret.
      operationId: WebhooksController_stripe
      parameters:
        - name: stripe-signature
          required: true
          in: header
          description: Stripe webhook signature
          schema:
            type: string
      responses:
        "200":
          description: Webhook processed successfully
      summary: Stripe webhook endpoint
      tags:
        - Webhooks
