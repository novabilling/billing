openapi: 3.0.0
paths:
  /api/auth/register:
    post:
      description: Create a new tenant account with a company name. This provisions an
        isolated database, generates an API key, and returns JWT tokens.
      operationId: AuthController_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDto"
      responses:
        "201":
          description: Tenant registered successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "409":
          description: Email already registered
      summary: Register a new tenant
      tags:
        - Auth
  /api/auth/login:
    post:
      description: Authenticate with email and password. Returns an access token and
        refresh token.
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid email or password
      summary: Login as tenant
      tags:
        - Auth
  /api/auth/refresh:
    post:
      description: Exchange a valid refresh token for a new access/refresh token pair.
      operationId: AuthController_refreshTokens
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenDto"
      responses:
        "200":
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponse"
        "401":
          description: Invalid or expired refresh token
      summary: Refresh access token
      tags:
        - Auth
  /api/auth/forgot-password:
    post:
      description: Send a password reset email to the specified address. Always
        returns success to prevent email enumeration.
      operationId: AuthController_forgotPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordDto"
      responses:
        "200":
          description: Reset email sent if account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
      summary: Request password reset
      tags:
        - Auth
  /api/auth/reset-password:
    post:
      description: Set a new password using the token received via email.
      operationId: AuthController_resetPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordDto"
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid or expired reset token
      summary: Reset password with token
      tags:
        - Auth
  /api/tenants/me:
    get:
      description: Retrieve the authenticated tenant's profile including settings and
        webhook configuration.
      operationId: TenantsController_getMe
      parameters: []
      responses:
        "200":
          description: Tenant profile details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
      security:
        - JWT: []
      summary: Get current tenant info
      tags:
        - Tenants
    patch:
      description: Update tenant profile fields such as company name, webhook URL, or
        custom settings.
      operationId: TenantsController_updateMe
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantDto"
      responses:
        "200":
          description: Tenant profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
      security:
        - JWT: []
      summary: Update current tenant
      tags:
        - Tenants
  /api/tenants/me/usage:
    get:
      description: Retrieve usage metrics including customer count, active
        subscriptions, and total revenue.
      operationId: TenantsController_getUsage
      parameters: []
      responses:
        "200":
          description: Usage metrics for the current billing period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantUsageResponse"
      security:
        - JWT: []
      summary: Get tenant usage statistics
      tags:
        - Tenants
  /api/tenants/me/api-keys:
    post:
      description: Generate a new API key with specified scopes. The full key is
        returned only once in the response — store it securely.
      operationId: TenantsController_createApiKey
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyBodyDto"
      responses:
        "201":
          description: API key created. The key value is shown only once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyResponse"
      security:
        - JWT: []
      summary: Create a new API key
      tags:
        - Tenants
    get:
      description: Retrieve all API keys for the tenant. Keys are masked for security
        — only the last 8 characters are shown.
      operationId: TenantsController_listApiKeys
      parameters: []
      responses:
        "200":
          description: List of API keys with masked values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKeyResponse"
      security:
        - JWT: []
      summary: List API keys
      tags:
        - Tenants
  /api/tenants/me/smtp/test:
    post:
      description: Send a test email using the tenant's saved SMTP settings (or system
        defaults if not configured). Only requires recipient email address.
      operationId: TenantsController_testSmtp
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - to
              properties:
                to:
                  type: string
                  example: test@example.com
                  description: Recipient email address
      responses:
        "200":
          description: Test email sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: SMTP test failed - check settings
      security:
        - JWT: []
      summary: Test SMTP settings
      tags:
        - Tenants
  /api/tenants/me/api-keys/{id}:
    delete:
      description: Permanently revoke an API key. Any requests using this key will
        immediately fail.
      operationId: TenantsController_deleteApiKey
      parameters:
        - name: id
          required: true
          in: path
          description: API key ID
          schema:
            type: string
      responses:
        "200":
          description: API key deleted
        "404":
          description: API key not found
      security:
        - JWT: []
      summary: Delete an API key
      tags:
        - Tenants
  /api/currencies:
    get:
      description: Retrieve all supported currencies with their symbols and metadata.
      operationId: CurrenciesController_getSupportedCurrencies
      parameters: []
      responses:
        "200":
          description: List of currencies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CurrencyResponse"
      summary: List supported currencies
      tags:
        - Currencies
  /api/customers:
    get:
      description: Retrieve a paginated list of customers. Supports filtering by
        search term, country, and currency.
      operationId: CustomersController_findAll
      parameters:
        - name: page
          required: false
          in: query
          schema:
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          schema:
            default: 20
            type: number
        - name: search
          required: false
          in: query
          description: Search by name or email
          schema:
            type: string
        - name: country
          required: false
          in: query
          schema:
            type: string
        - name: currency
          required: false
          in: query
          schema:
            type: string
        - name: sortBy
          required: false
          in: query
          schema:
            default: createdAt
            type: string
        - name: sortOrder
          required: false
          in: query
          schema:
            default: desc
            type: string
            enum:
              - asc
              - desc
      responses:
        "200":
          description: Paginated list of customers with metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCustomerResponse"
        "401":
          description: Unauthorized - invalid or missing API key
      security:
        - api-key: []
      summary: List customers
      tags:
        - Customers
    post:
      description: Create a customer record. The externalId should be unique and map
        to your application's user ID.
      operationId: CustomersController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerDto"
      responses:
        "201":
          description: Customer created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "409":
          description: Customer with this externalId already exists
      security:
        - api-key: []
      summary: Create a new customer
      tags:
        - Customers
  /api/customers/{id}:
    get:
      description: Retrieve detailed information about a specific customer including
        their billing history summary.
      operationId: CustomersController_findOne
      parameters:
        - name: id
          required: true
          in: path
          description: Customer ID
          schema:
            type: string
      responses:
        "200":
          description: Customer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "404":
          description: Customer not found
      security:
        - api-key: []
      summary: Get customer by ID
      tags:
        - Customers
    patch:
      description: Update customer fields. Only provided fields will be changed.
      operationId: CustomersController_update
      parameters:
        - name: id
          required: true
          in: path
          description: Customer ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerDto"
      responses:
        "200":
          description: Customer updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "404":
          description: Customer not found
      security:
        - api-key: []
      summary: Update a customer
      tags:
        - Customers
    delete:
      description: Permanently delete a customer. Fails if the customer has active
        subscriptions.
      operationId: CustomersController_delete
      parameters:
        - name: id
          required: true
          in: path
          description: Customer ID
          schema:
            type: string
      responses:
        "200":
          description: Customer deleted successfully
        "400":
          description: Cannot delete - customer has active subscriptions
        "404":
          description: Customer not found
      security:
        - api-key: []
      summary: Delete a customer
      tags:
        - Customers
  /api/customers/{id}/subscriptions:
    get:
      description: Retrieve all subscriptions for a specific customer.
      operationId: CustomersController_findSubscriptions
      parameters:
        - name: id
          required: true
          in: path
          description: Customer ID
          schema:
            type: string
      responses:
        "200":
          description: List of customer subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriptionResponse"
        "404":
          description: Customer not found
      security:
        - api-key: []
      summary: Get customer subscriptions
      tags:
        - Customers
  /api/customers/{id}/invoices:
    get:
      description: Retrieve all invoices for a specific customer.
      operationId: CustomersController_findInvoices
      parameters:
        - name: id
          required: true
          in: path
          description: Customer ID
          schema:
            type: string
      responses:
        "200":
          description: List of customer invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvoiceResponse"
        "404":
          description: Customer not found
      security:
        - api-key: []
      summary: Get customer invoices
      tags:
        - Customers
  /api/customers/{id}/payments:
    get:
      description: Retrieve all payments made by a specific customer.
      operationId: CustomersController_findPayments
      parameters:
        - name: id
          required: true
          in: path
          description: Customer ID
          schema:
            type: string
      responses:
        "200":
          description: List of customer payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentResponse"
        "404":
          description: Customer not found
      security:
        - api-key: []
      summary: Get customer payments
      tags:
        - Customers
  /api/customers/{id}/payment-methods:
    get:
      description: Retrieve saved payment methods (cards, tokens) for a customer.
      operationId: CustomersController_findPaymentMethods
      parameters:
        - name: id
          required: true
          in: path
          description: Customer ID
          schema:
            type: string
      responses:
        "200":
          description: List of saved payment methods
      security:
        - api-key: []
      summary: Get customer payment methods
      tags:
        - Customers
  /api/customers/{id}/payment-methods/{methodId}:
    delete:
      description: Remove a saved payment method from a customer.
      operationId: CustomersController_deletePaymentMethod
      parameters:
        - name: id
          required: true
          in: path
          description: Customer ID
          schema:
            type: string
        - name: methodId
          required: true
          in: path
          description: Payment method ID
          schema:
            type: string
      responses:
        "200":
          description: Payment method deleted
        "404":
          description: Payment method not found
      security:
        - api-key: []
      summary: Delete a payment method
      tags:
        - Customers
  /api/plans:
    get:
      description: Retrieve all billing plans with their prices. Optionally filter by
        active status.
      operationId: PlansController_findAll
      parameters:
        - name: isActive
          required: false
          in: query
          description: Filter by active status
          schema:
            type: boolean
      responses:
        "200":
          description: List of plans with prices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanResponse"
      security:
        - api-key: []
      summary: List all plans
      tags:
        - Plans
    post:
      description: Create a billing plan with a unique code. Optionally include prices
        for different currencies. Plans can have MONTHLY, QUARTERLY, or YEARLY
        billing intervals.
      operationId: PlansController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanDto"
      responses:
        "201":
          description: Plan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "409":
          description: Plan with this code already exists
      security:
        - api-key: []
      summary: Create a new plan
      tags:
        - Plans
  /api/plans/{id}:
    get:
      description: Retrieve a plan with all its prices and features.
      operationId: PlansController_findOne
      parameters:
        - name: id
          required: true
          in: path
          description: Plan ID
          schema:
            type: string
      responses:
        "200":
          description: Plan details with prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "404":
          description: Plan not found
      security:
        - api-key: []
      summary: Get plan by ID
      tags:
        - Plans
    patch:
      description: Update plan details like name, description, features, or billing
        interval.
      operationId: PlansController_update
      parameters:
        - name: id
          required: true
          in: path
          description: Plan ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlanDto"
      responses:
        "200":
          description: Plan updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "404":
          description: Plan not found
      security:
        - api-key: []
      summary: Update a plan
      tags:
        - Plans
    delete:
      description: Delete a billing plan. Plans with active subscriptions should be
        deactivated instead.
      operationId: PlansController_delete
      parameters:
        - name: id
          required: true
          in: path
          description: Plan ID
          schema:
            type: string
      responses:
        "200":
          description: Plan deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "404":
          description: Plan not found
      security:
        - api-key: []
      summary: Delete a plan
      tags:
        - Plans
  /api/plans/{id}/prices:
    post:
      description: Add a price in a specific currency to a plan. Each plan can have
        one price per currency.
      operationId: PlansController_addPrice
      parameters:
        - name: id
          required: true
          in: path
          description: Plan ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanPriceDto"
      responses:
        "201":
          description: Price added to plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanPriceResponse"
        "404":
          description: Plan not found
      security:
        - api-key: []
      summary: Add a price to a plan
      tags:
        - Plans
  /api/plans/{id}/prices/{priceId}:
    patch:
      description: Change the amount for an existing price on a plan.
      operationId: PlansController_updatePrice
      parameters:
        - name: id
          required: true
          in: path
          description: Plan ID
          schema:
            type: string
        - name: priceId
          required: true
          in: path
          description: Price ID
          schema:
            type: string
      responses:
        "200":
          description: Price updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanPriceResponse"
        "404":
          description: Plan or price not found
      security:
        - api-key: []
      summary: Update a plan price
      tags:
        - Plans
    delete:
      description: Remove a price from a plan. Active subscriptions using this price
        will not be affected.
      operationId: PlansController_deletePrice
      parameters:
        - name: id
          required: true
          in: path
          description: Plan ID
          schema:
            type: string
        - name: priceId
          required: true
          in: path
          description: Price ID
          schema:
            type: string
      responses:
        "200":
          description: Price deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanPriceResponse"
        "404":
          description: Plan or price not found
      security:
        - api-key: []
      summary: Delete a plan price
      tags:
        - Plans
  /api/subscriptions:
    get:
      description: Retrieve a paginated list of subscriptions. Supports filtering by
        status, customer, and plan.
      operationId: SubscriptionsController_findAll
      parameters:
        - name: status
          required: false
          in: query
          description: Filter by status (ACTIVE, TRIALING, PAUSED, CANCELED)
          schema:
            type: string
        - name: customerId
          required: false
          in: query
          description: Filter by customer ID
          schema:
            type: string
        - name: planId
          required: false
          in: query
          description: Filter by plan ID
          schema:
            type: string
        - name: page
          required: false
          in: query
          schema:
            type: number
        - name: limit
          required: false
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Paginated list of subscriptions with customer and plan details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedSubscriptionResponse"
      security:
        - api-key: []
      summary: List subscriptions
      tags:
        - Subscriptions
    post:
      description: Subscribe a customer to a plan. The plan must have a price matching
        the specified currency. Optionally set a trial period in days.
      operationId: SubscriptionsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionDto"
      responses:
        "201":
          description: "Subscription created (status: ACTIVE or TRIALING)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "400":
          description: Plan inactive or no price for specified currency
        "404":
          description: Customer or plan not found
      security:
        - api-key: []
      summary: Create a new subscription
      tags:
        - Subscriptions
  /api/subscriptions/{id}:
    get:
      description: Retrieve detailed subscription information including customer, plan
        with prices, and recent invoices.
      operationId: SubscriptionsController_findOne
      parameters:
        - name: id
          required: true
          in: path
          description: Subscription ID
          schema:
            type: string
      responses:
        "200":
          description: Subscription details with related records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "404":
          description: Subscription not found
      security:
        - api-key: []
      summary: Get subscription by ID
      tags:
        - Subscriptions
    patch:
      description: Update the metadata field on a subscription. Other fields cannot be
        changed directly.
      operationId: SubscriptionsController_update
      parameters:
        - name: id
          required: true
          in: path
          description: Subscription ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriptionDto"
      responses:
        "200":
          description: Subscription metadata updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "404":
          description: Subscription not found
      security:
        - api-key: []
      summary: Update subscription metadata
      tags:
        - Subscriptions
  /api/subscriptions/{id}/cancel:
    post:
      description: Cancel a subscription either immediately or at the end of the
        current billing period. When set to "period_end", the subscription
        remains active until the current period expires.
      operationId: SubscriptionsController_cancel
      parameters:
        - name: id
          required: true
          in: path
          description: Subscription ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelSubscriptionDto"
      responses:
        "200":
          description: Subscription canceled or scheduled for cancellation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "400":
          description: Subscription is already canceled
        "404":
          description: Subscription not found
      security:
        - api-key: []
      summary: Cancel a subscription
      tags:
        - Subscriptions
  /api/subscriptions/{id}/pause:
    post:
      description: Temporarily pause an active subscription. Only active subscriptions
        can be paused.
      operationId: SubscriptionsController_pause
      parameters:
        - name: id
          required: true
          in: path
          description: Subscription ID
          schema:
            type: string
      responses:
        "200":
          description: Subscription paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "400":
          description: Only active subscriptions can be paused
        "404":
          description: Subscription not found
      security:
        - api-key: []
      summary: Pause a subscription
      tags:
        - Subscriptions
  /api/subscriptions/{id}/resume:
    post:
      description: Resume a previously paused subscription back to active status.
      operationId: SubscriptionsController_resume
      parameters:
        - name: id
          required: true
          in: path
          description: Subscription ID
          schema:
            type: string
      responses:
        "200":
          description: Subscription resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "400":
          description: Only paused subscriptions can be resumed
        "404":
          description: Subscription not found
      security:
        - api-key: []
      summary: Resume a paused subscription
      tags:
        - Subscriptions
  /api/subscriptions/{id}/change-plan:
    post:
      description: Switch a subscription to a different plan. The new plan must have a
        price for the subscription's currency. A new billing period starts
        immediately with the new plan.
      operationId: SubscriptionsController_changePlan
      parameters:
        - name: id
          required: true
          in: path
          description: Subscription ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePlanDto"
      responses:
        "200":
          description: Plan changed and billing period reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "400":
          description: New plan inactive or no matching price
        "404":
