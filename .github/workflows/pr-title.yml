name: PR Title

# Squash-merged PR titles become the commits release-please reads, so
# they must say what kind of change they are. Separate from CI so a
# retitle (edited) re-runs only this check.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title follows Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" =~ ^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?:\ .+ ]]; then
            echo "OK: $PR_TITLE"
          else
            echo "::error::PR title must look like 'feat: add payouts', 'fix(ledger): ...' or 'feat!: ...' for breaking changes. fix → patch, feat → minor, ! → major."
            exit 1
          fi
