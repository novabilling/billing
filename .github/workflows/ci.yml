name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Backend: lint, type-check, unit tests
  # ──────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Generate Prisma clients
        run: |
          npx prisma generate --schema=./prisma/schema-central.prisma
          npx prisma generate --schema=./prisma/schema-tenant.prisma

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx jest test/unit --no-coverage --forceExit

  # ──────────────────────────────────────────────
  # OpenAPI: the committed spec must match the code (SDKs and docs are built from it)
  # ──────────────────────────────────────────────
  openapi-check:
    name: OpenAPI Spec
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Generate Prisma clients
        run: |
          npx prisma generate --schema=./prisma/schema-central.prisma
          npx prisma generate --schema=./prisma/schema-tenant.prisma

      - name: Export the spec and compare with the committed one
        run: |
          npm run -s openapi:export
          git diff --exit-code -- openapi/openapi.json || {
            echo "::error::backend/openapi/openapi.json is out of date. Run 'npm run openapi:export' in backend/ and commit the result."
            exit 1
          }

  # ──────────────────────────────────────────────
  # Backend: migrations and integration tests on PostgreSQL
  # ──────────────────────────────────────────────
  backend-integration:
    name: Backend Integration (PostgreSQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG: postgresql://postgres:postgres@localhost:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Generate Prisma clients
        run: |
          npx prisma generate --schema=./prisma/schema-central.prisma
          npx prisma generate --schema=./prisma/schema-tenant.prisma

      - name: Create test databases and apply migrations
        run: |
          psql "$PG/postgres" -c 'CREATE DATABASE central_test' -c 'CREATE DATABASE tenant_test'
          CENTRAL_DATABASE_URL=$PG/central_test npx prisma migrate deploy --config prisma.config.ts
          DATABASE_URL=$PG/tenant_test npx prisma migrate deploy --config prisma.tenant.config.ts

      - name: Integration tests
        env:
          CENTRAL_TEST_DATABASE_URL: ${{ env.PG }}/central_test
          LEDGER_TEST_DATABASE_URL: ${{ env.PG }}/tenant_test
          MIGRATION_TEST_ADMIN_URL: ${{ env.PG }}/postgres
        run: npx jest test/integration --runInBand --no-coverage --forceExit

  # ──────────────────────────────────────────────
  # Dashboard: type-check and build
  # ──────────────────────────────────────────────
  dashboard-build:
    name: Dashboard Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  # ──────────────────────────────────────────────
  # Landing: type-check and build
  # ──────────────────────────────────────────────
  landing-build:
    name: Landing Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  # ──────────────────────────────────────────────
  # E2E: full stack with Docker Compose
  # Runs only on push to main (saves minutes on PRs)
  # ──────────────────────────────────────────────
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d --build --wait
        timeout-minutes: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install test dependencies
        working-directory: backend
        run: npm ci

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health > /dev/null 2>&1; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 5
          done
          echo "API failed to start"
          docker compose logs api
          exit 1

      - name: Run E2E tests
        working-directory: backend
        run: npx jest test/e2e --runInBand --no-coverage --forceExit
        env:
          E2E_API_URL: http://localhost:4000

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Cleanup
        if: always()
        run: docker compose down -v

  # ──────────────────────────────────────────────
  # Docker build check (ensures images build)
  # ──────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [backend, dashboard, landing, docs]
        include:
          - service: backend
            context: ./backend
          - service: dashboard
            context: ./dashboard
          - service: landing
            context: ./landing
          - service: docs
            context: ./docs
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }}
        run: docker build -t pimabill/${{ matrix.service }}:ci ${{ matrix.context }}
