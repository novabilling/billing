# SDKs are generated from the committed spec (backend/openapi/openapi.json),
# never in pull-request CI. Run `fern generate --local --group <group>` or the
# "SDKs" GitHub workflow (on releases and on demand).
#
# tier1: published with every release (TypeScript, Python, PHP).
# tier2: generated on request for users who need them (Go, Java, Ruby, C#).
# SDKs are MIT-licensed so any project can embed them; the server stays AGPL.
# Rust and Swift are not generated: billing calls need the secret API key,
# so there is no client-side SDK; mobile apps call their own backend.
api:
  specs:
    - openapi: ../backend/openapi/openapi.json
      overrides: overrides.yml

default-group: tier1

groups:
  tier1:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.48.2
        metadata:
          license: MIT
        output:
          location: local-file-system
          path: ../sdks/typescript
        config:
          namespaceExport: PimaBill

      - name: fernapi/fern-python-sdk
        version: 4.57.2
        metadata:
          license: MIT
        output:
          location: local-file-system
          path: ../sdks/python
        config:
          client_class_name: PimaBill
          package_name: pimabill
          timeout_in_seconds: 60

      - name: fernapi/fern-php-sdk
        version: 2.0.0
        metadata:
          license: MIT
        output:
          location: local-file-system
          path: ../sdks/php
        config:
          namespace: PimaBill

  tier2:
    generators:
      - name: fernapi/fern-go-sdk
        version: 1.24.0
        metadata:
          license: MIT
        output:
          location: local-file-system
          path: ../sdks/go
        config:
          module:
            path: github.com/pimabill/pimabill-go
          import_path: github.com/pimabill/pimabill-go

      - name: fernapi/fern-java-sdk
        version: 3.36.0
        metadata:
          license: MIT
        output:
          location: local-file-system
          path: ../sdks/java
        config:
          group_id: com.pimabill
          artifact_id: pimabill-sdk
          client_class_name: PimaBillClient

      - name: fernapi/fern-ruby-sdk
        version: 1.0.0-rc85
        metadata:
          license: MIT
        output:
          location: local-file-system
          path: ../sdks/ruby
        config:
          client_class_name: PimaBill
          module_name: PimaBill

      - name: fernapi/fern-csharp-sdk
        version: 2.20.5
        metadata:
          license: MIT
        output:
          location: local-file-system
          path: ../sdks/csharp
        config:
          namespace: PimaBill
          client_class_name: PimaBillClient
