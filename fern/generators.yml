# SDKs are generated from the committed spec (backend/openapi/openapi.json),
# never in pull-request CI. Run `fern generate --local --group <group>` or the
# "SDKs" GitHub workflow (on releases and on demand).
#
# tier1: published with every release (TypeScript, Python, PHP).
# tier2: generated on request for users who need them (Go, Java, Ruby, C#).
# Rust and Swift are not generated: billing calls need the secret API key,
# so there is no client-side SDK; mobile apps call their own backend.
api:
  specs:
    - openapi: ../backend/openapi/openapi.json
      overrides: overrides.yml

default-group: tier1

groups:
  tier1:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.48.2
        output:
          location: local-file-system
          path: ../sdks/typescript
        config:
          namespaceExport: NovaBilling

      - name: fernapi/fern-python-sdk
        version: 4.57.2
        output:
          location: local-file-system
          path: ../sdks/python
        config:
          client_class_name: NovaBilling
          package_name: novabilling
          timeout_in_seconds: 60

      - name: fernapi/fern-php-sdk
        version: 2.0.0
        output:
          location: local-file-system
          path: ../sdks/php
        config:
          namespace: NovaBilling

  tier2:
    generators:
      - name: fernapi/fern-go-sdk
        version: 1.24.0
        output:
          location: local-file-system
          path: ../sdks/go
        config:
          module:
            path: github.com/novabilling/novabilling-go
          import_path: github.com/novabilling/novabilling-go

      - name: fernapi/fern-java-sdk
        version: 3.36.0
        output:
          location: local-file-system
          path: ../sdks/java
        config:
          group_id: com.novabilling
          artifact_id: novabilling-sdk
          client_class_name: NovaBillingClient

      - name: fernapi/fern-ruby-sdk
        version: 1.0.0-rc85
        output:
          location: local-file-system
          path: ../sdks/ruby
        config:
          client_class_name: NovaBilling
          module_name: NovaBilling

      - name: fernapi/fern-csharp-sdk
        version: 2.20.5
        output:
          location: local-file-system
          path: ../sdks/csharp
        config:
          namespace: NovaBilling
          client_class_name: NovaBillingClient
